# ==================================================
# CI/CD: build-and-test
# Why:
#   - ShellCheck standalone scripts
#   - Build integrated single-file distribution
#   - ShellCheck integrated distribution
#   - Smoke/security Bats tests
#   - Verify embedded Python and required functions
#   - Publish immutable build artifacts
# ==================================================

name: build-and-test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          shellcheck --version
          bats --version
          python3 --version

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/sshplus scripts/*.sh || true

      - name: ShellCheck standalone scripts
        run: |
          shellcheck --severity=warning -e SC2034 -x \
            install.sh \
            bin/sshplus \
            scripts/*.sh

      - name: Build single-file distribution
        run: bash scripts/build.sh

      - name: ShellCheck integrated distribution
        run: |
          shellcheck --severity=warning -e SC2034 -x dist/sshplus.sh

      - name: Verify distribution checksum
        run: |
          cd dist
          sha256sum -c sshplus.sh.sha256

      - name: Verify required functions
        run: |
          for fn in \
            main \
            show_menu \
            function_create_user \
            function_delete_user \
            function_renew_user \
            function_mode_connection \
            function_firewall \
            function_websocket \
            function_toggle_limit \
            function_toggle_badvpn \
            function_toggle_bot \
            function_auto_menu \
            function_openvpn \
            function_v2ray_manager \
            function_self_update \
            function_uninstall
          do
            if grep -q "^${fn}()" dist/sshplus.sh; then
              echo "OK: ${fn}"
            else
              echo "MISSING: ${fn}"
              exit 1
            fi
          done

      - name: Verify embedded programs
        run: |
          python3 tests/check_embedded.py

      - name: Run Bats test suite
        run: |
          bats tests

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sshplus-dist
          path: dist/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build distribution
        run: bash scripts/build.sh

      - name: Verify release checksum
        run: |
          cd dist
          sha256sum -c sshplus.sh.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: |
            dist/sshplus.sh
            dist/sshplus.sh.sha256
